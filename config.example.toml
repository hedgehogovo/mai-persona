[plugin]
enabled = false
# 由 MaiBot Runner 维护，请勿手动修改
config_version = "1.0.0"
timezone = "Asia/Shanghai"
tick_seconds = 60
max_interaction_chars = 1200
retry_cooldown_minutes = 15.0
enable_proactive_messages = false

[persona]
name = ""
viewpoint = []
goals = ""
relationship_stages = []
event_line_domains = []
micro_event_domains = []
# 开启后按关系阶段限制自我披露深度
disclosure_depth_gating = true

[emotion]
trait_p = 0.0
trait_a = 0.0
trait_d = 0.0
tau_emotion_min = 20.0
tau_mood_hours = 12.0
regulation = 0.65
appraisal_window_hours = 2.0
max_delta_per_event = 0.3
max_micro_event_bias = 0.15

[affection]
evaluate_daily_at = "23:00"
max_delta = 0.1
evidence_hours = 24.0
# 长期不来往时关系缓慢冷却（已知缺席期间不冷却）
cooldown_enabled = true
cooldown_after_days = 14.0
cooldown_rate_per_day = 0.01

[event_lines]
max_active = 3
advance_times = ["13:00", "21:00"]
talkable_threshold = 0.6

[schedule]
min_interval_hours = 4.0
daily_limit = 3
silent_hours = [1, 7]
default_active_hour_hint = 21
fallback_replan_hours = 24.0
# 私聊中明确结束对话后，请 Planner 决定下一次主动联系该用户的时间
decide_after_private_chat_end = false
# off / whitelist / blacklist，按用户 ID 精确匹配
decide_user_filter_mode = "off"
decide_user_whitelist = []
decide_user_blacklist = []

[batch]
todo_extract_hours = 4.0
life_generate_at = "08:00"
# 开启后只读使用外部日程；日常小事件仍由 Mai Persona 维护
use_maitrace_schedule = false
# 日程提供方插件 ID：实现 maibot.schedule v1 的按协议读取，否则回落 MaiTrace 旧接口
schedule_provider = "Rabbit-Jia-Er.MaiTrace"
diary_generate_at = "23:30"

[exposure]
daily_limit = 2

[humanlike]
# 从用户发言里整理值得之后关心一次的事项
followup_enabled = true
followup_extract_hours = 6.0
followup_window_hours = 24.0
followup_ttl_hours = 72.0
# 负面情绪后暂停给该用户插入跟进提示（不影响全局心境）
emotion_carry_over_hours = 2.0
# 检测到摩擦时提示先修复
repair_enabled = true
repair_ttl_hours = 24.0
# 按对方说话长度收敛（越熟影响越明显）
style_adaptation = true
style_min_samples = 20
# 用户明确不想聊的话题保留天数
boundary_ttl_days = 30.0
# 非计划内长时间没联系时的轻微失落与重逢回升（按亲密度缩放）
absence_dip_hours = 72.0
absence_dip = 0.06
# 一天内因缺席造成的心境下移总上限，避免多人同时失联时叠加
absence_dip_daily_cap = 0.08
reunion_boost = 0.08
# 摩擦留下的短期余怒（按亲密度缩放）
grudge_enabled = true
grudge_cap = 0.3
grudge_tau_days = 3.0
# 连续互动消耗、休息恢复的表达能量
energy_enabled = true
energy_tau_hours = 8.0
# 只在关系较熟时回指过去的正面向细节
peak_enabled = true
peak_min_closeness = 0.35
peak_cooldown_days = 5.0
# 按对方自己的回复节奏判断沉默（慢回的人不算冷淡）
rhythm_enabled = true
rhythm_factor = 3.0
# 摩擦严重度与修复回检
repair_severity_scaling = true
repair_escalation = true
# 被划界后只在最初这段时间提示，之后静默避开
boundary_notice_hours = 24.0
# 聊到一半的话题
threads_enabled = true
thread_ttl_days = 14.0
# 披露互惠
reciprocity_enabled = true
reciprocity_gap = 3
# 固定聊天时段
ritual_enabled = true
ritual_min_days = 5
ritual_cooldown_days = 7.0
# 倾诉状态
support_enabled = true
support_turns = 2
# 推测信息标注
uncertainty_hints = true
# 认识天数里程碑
milestone_enabled = true
milestone_every_days = 30
